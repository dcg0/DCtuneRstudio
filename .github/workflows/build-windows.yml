name: Build Windows x86_64

on:
  workflow_dispatch:
  push:
    branches: ["feature/dc-tuner-studio-mvp"]

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12 x64
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64

      - name: Install build dependencies
        shell: pwsh
        run: python -m pip install --upgrade pyinstaller pyserial

      - name: Build native executable
        shell: pwsh
        run: ./packaging/build-windows.ps1

      - name: Verify executable
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/DC-Tuner-Studio.exe")) { throw "Executable was not produced" }
          Get-Item "dist/DC-Tuner-Studio.exe" | Format-List FullName,Length

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: DC-Tuner-Studio-Windows-x86_64
          path: dist/DC-Tuner-Studio.exe
          if-no-files-found: error
